# M04 : un secret qui circule (JSON.stringify, gabarit, concaténation, variable
# intermédiaire, message d'erreur) jusqu'à un journal ou une exception.
rules:
  - id: releve-secret-flows-to-log
    languages: [typescript, javascript]
    mode: taint
    severity: ERROR
    message: >-
      Une valeur qui ressemble à un secret atteint un journal ou un message
      d'erreur (directement ou après transformation). Journalisez un
      identifiant ou un booléen ; masquez avec redact() si une trace est utile.
    metadata:
      threat: [M04]
      cwe: ["CWE-532", "CWE-209"]
      owasp: "A09:2021 Security Logging and Monitoring Failures"
    pattern-sources:
      - patterns:
          - pattern: $X
          - metavariable-regex:
              metavariable: $X
              regex: ^(?!(?:[\w\[\]"'?!]+\.)*(?:has|is|nb|count|masked|redacted)(?:[A-Z_]|$))(?i:[\w.\[\]"'?!]*(?:secret|token|passw|pwd|apikey|api_key|authorization|bearer|service_?role|jwt|credential|cookie|private_?key|otp|mfa_?code|client_?secret|refresh)[\w.\[\]"'?!]*)$
    pattern-sinks:
      - patterns:
          - pattern: console.$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(log|info|warn|error|debug|trace|table|dir)$
      - patterns:
          - pattern: $L.$M(...)
          - metavariable-regex:
              metavariable: $L
              regex: ^(log|logger|audit)$
          - metavariable-regex:
              metavariable: $M
              regex: ^(log|info|warn|error|debug|trace|event)$
      - pattern: new Error(...)
    pattern-sanitizers:
      - pattern: Boolean(...)
      - pattern: "!!$X"
      - pattern: typeof $X
      - pattern: $X.length
      - pattern: redact(...)
