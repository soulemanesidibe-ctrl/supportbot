# M04 : pas de secret dans un journal (écriture directe d'une valeur au nom de secret,
# ou d'un objet qui en contient). Les flux indirects sont couverts par secrets-flow.yml.
rules:
  - id: releve-secret-in-console-log
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Une valeur qui ressemble à un secret (jeton, mot de passe, clé, cookie,
      en-tête d'autorisation) est écrite dans la console. Journalisez un
      identifiant ou un booléen (« jeton présent »), jamais la valeur.
    metadata:
      threat: [M04]
      cwe: ["CWE-532"]
      owasp: "A09:2021 Security Logging and Monitoring Failures"
    patterns:
      - pattern-either:
          - pattern: console.$M(..., $X, ...)
          - pattern: |
              console.$M(..., { ..., $X: $V, ... }, ...)
          - pattern: |
              console.$M(..., { ..., $X, ... }, ...)
          - pattern: console.$M(..., `...${$X}...`, ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(log|info|warn|error|debug|trace|table|dir)$
      - metavariable-regex:
          metavariable: $X
          regex: ^(?!(?:[\w\[\]"'?!]+\.)*(?:has|is|nb|count|masked|redacted)(?:[A-Z_]|$))(?i:[\w.\[\]"'?!]*(?:secret|token|passw|pwd|apikey|api_key|authorization|bearer|service_?role|jwt|credential|cookie|private_?key|otp|mfa_?code|client_?secret|refresh)[\w.\[\]"'?!]*)$

  - id: releve-secret-in-logger
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Une valeur qui ressemble à un secret (jeton, mot de passe, clé, cookie,
      en-tête d'autorisation) est écrite dans le journal applicatif.
      Journalisez un identifiant ou un booléen, jamais la valeur.
    metadata:
      threat: [M04]
      cwe: ["CWE-532"]
      owasp: "A09:2021 Security Logging and Monitoring Failures"
    patterns:
      - pattern-either:
          - pattern: $L.$M(..., $X, ...)
          - pattern: |
              $L.$M(..., { ..., $X: $V, ... }, ...)
          - pattern: |
              $L.$M(..., { ..., $X, ... }, ...)
          - pattern: $L.$M(..., `...${$X}...`, ...)
      - metavariable-regex:
          metavariable: $L
          regex: ^(log|logger|audit)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(log|info|warn|error|debug|trace|event)$
      - metavariable-regex:
          metavariable: $X
          regex: ^(?!(?:[\w\[\]"'?!]+\.)*(?:has|is|nb|count|masked|redacted)(?:[A-Z_]|$))(?i:[\w.\[\]"'?!]*(?:secret|token|passw|pwd|apikey|api_key|authorization|bearer|service_?role|jwt|credential|cookie|private_?key|otp|mfa_?code|client_?secret|refresh)[\w.\[\]"'?!]*)$

  - id: releve-log-whole-request-or-env
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Journaliser l'objet requête, les en-têtes ou l'environnement entier écrit
      des secrets (Authorization, cookies, clés). Journalisez des champs choisis.
    metadata:
      threat: [M04]
      cwe: ["CWE-532"]
      owasp: "A09:2021 Security Logging and Monitoring Failures"
    patterns:
      - pattern-either:
          - pattern: $L.$M(..., $REQ.headers, ...)
          - pattern: $L.$M(..., Object.fromEntries($REQ.headers), ...)
          - pattern: $L.$M(..., JSON.stringify($REQ.headers), ...)
          - pattern: $L.$M(..., Deno.env.toObject(), ...)
          - pattern: $L.$M(..., process.env, ...)
          - pattern: $L.$M(..., JSON.stringify(process.env), ...)
      - metavariable-regex:
          metavariable: $L
          regex: ^(console|log|logger|audit)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(log|info|warn|error|debug|trace|table|dir|event)$
