# M01, M05, M12 : une capacité de connecteur ne s'appelle jamais directement.
# Lecture : callCapability() ; action privilégiée : executeApprovedAction().
# Les deux fichiers de ces portes portent une exception justifiée (voir scripts/check-nosemgrep.sh).
rules:
  - id: releve-capability-invoked-outside-gate
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Une capacité de connecteur ne s'appelle jamais directement. Lecture :
      callCapability() (supabase/functions/_shared/capabilities/call.ts), qui
      applique le filtre déterministe de classe d'action. Écriture ou action
      privilégiée : executeApprovedAction() (supabase/functions/_shared/actions/execute.ts),
      seulement après validation d'une action_request.
    metadata:
      threat: [M01, M05, M12]
      cwe: ["CWE-285", "CWE-862"]
      owasp: "LLM06:2025 Excessive Agency"
    pattern-either:
      - pattern: $CONNECTOR.invokeCapability
      - pattern: $CONNECTOR["invokeCapability"]
      - pattern: const {..., invokeCapability, ...} = $CONNECTOR
