# Hooks locaux de sécurité. Installation : scripts/dev-setup.sh
# Les dépôts de hooks sont épinglés par SHA (commentaire = version lisible).
default_install_hook_types: [pre-commit, pre-push]
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (détection de secrets dans les fichiers indexés)
        args: ["--config=.gitleaks.toml"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: detect-private-key
        exclude: ^\.(claude|agents)/skills/
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: no-commit-to-branch
        name: interdit de commiter sur main
        args: ["--branch", "main"]

  - repo: local
    hooks:
      - id: check-nosemgrep
        name: exceptions Semgrep limitées aux fichiers prévus
        entry: scripts/check-nosemgrep.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: semgrep-releve
        name: semgrep (règles de sécurité du projet)
        entry: semgrep --config security/semgrep --strict --error --metrics=off --quiet
        language: python
        additional_dependencies: ["semgrep==1.184.0"]
        types_or: [ts, tsx, javascript, jsx]
        # Miroir de .semgrepignore : pre-commit passe les fichiers un par un, ce qui contourne ce fichier.
        exclude: '^(security/semgrep/|\.claude/|\.agents/|docs/)|\.(test|spec)\.tsx?$|/__tests__/'
        stages: [pre-push]
