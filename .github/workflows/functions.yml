# Edge Functions (Deno) : vérification de types, analyse de style et tests unitaires de supabase/functions/.
# Aucun accès réseau d'exécution, aucun secret : les tests injectent des dépendances factices (voir *.test.ts).
# L'exécutable Deno est épinglé par security/tools/deno (empreintes SHA-512, installation sans scripts).
name: Edge Functions

on:
  push:
    branches: ["**"]
    paths:
      - "supabase/functions/**"
      - "security/tools/deno/**"
      - ".github/workflows/functions.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "security/tools/deno/**"
      - ".github/workflows/functions.yml"
  workflow_dispatch:
  schedule:
    - cron: "29 6 * * 1"

permissions: {}

concurrency:
  group: fonctions-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deno:
    name: Types, style et tests (Deno)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node.js (pour l'installation épinglée de Deno)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Installer Deno (version et empreintes verrouillées, sans scripts)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix security/tools/deno
          echo "$GITHUB_WORKSPACE/security/tools/deno/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Version de Deno
        run: deno --version

      - name: Vérifier les types (verrou figé)
        working-directory: supabase/functions
        run: deno task check

      - name: Analyse de style et d'erreurs courantes
        working-directory: supabase/functions
        run: deno lint

      - name: Tests unitaires
        working-directory: supabase/functions
        run: deno task test

  mutations:
    name: Test de mutation des fonctions (chaque défense cassée doit être vue)
    # Plus long : avant toute fusion, chaque semaine et à la demande, pas à chaque envoi de branche.
    if: ${{ github.event_name != 'push' }}
    needs: deno
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node.js (pour l'installation épinglée de Deno)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Installer Deno (version et empreintes verrouillées, sans scripts)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix security/tools/deno
          echo "$GITHUB_WORKSPACE/security/tools/deno/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Casser chaque défense et vérifier que le bon test échoue
        run: supabase/functions/mutations.sh
