# Sécurité du code : secrets, analyse statique, workflows eux-mêmes.
# Modèle : docs/threat-model.md (M01, M03, M04, M06, M23) ; mode d'emploi : docs/securite-code-et-ci.md.
# Principes : permissions nulles par défaut, actions épinglées par SHA, binaires vérifiés par empreinte,
# aucune donnée d'événement (titre de PR, nom de branche...) interpolée dans un script.
name: Sécurité

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"

permissions: {}

# Une seule exécution à la fois par branche ; une exécution « push » et la « pull_request »
# de la même branche partagent le groupe, la plus récente remplace l'autre.
concurrency:
  group: securite-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Récupérer le dépôt et tout son historique
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer gitleaks (empreinte vérifiée)
        run: >-
          scripts/ci/install-release.sh
          "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          gitleaks gitleaks

      - name: Tester la configuration gitleaks
        run: scripts/test-gitleaks-config.sh

      - name: Rechercher des secrets dans tout l'historique
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 --verbose

      - name: Tester le garde-fou contre les données réelles de pilote
        run: scripts/test-check-no-real-data.sh

      - name: Refuser les données réelles de pilote dans le dépôt public
        run: scripts/check-no-real-data.sh

  sast:
    name: Analyse statique (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Installer Semgrep (version et empreintes verrouillées)
        run: python -m pip install --disable-pip-version-check --require-hashes --requirement security/requirements/semgrep.txt

      - name: Tester les règles du projet
        run: semgrep --test --metrics=off security/semgrep

      - name: Vérifier les exceptions aux règles
        run: scripts/check-nosemgrep.sh

      - name: Analyser le code (règles du projet + jeux de règles du registre)
        run: >-
          semgrep scan
          --config security/semgrep
          --config p/typescript
          --config p/owasp-top-ten
          --metrics=off --strict --error
          --sarif-output=semgrep.sarif
          .

      - name: Conserver le rapport
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 30

  workflows:
    name: Workflows GitHub (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Installer zizmor (version et empreintes verrouillées)
        run: python -m pip install --disable-pip-version-check --require-hashes --requirement security/requirements/zizmor.txt

      - name: Installer actionlint (empreinte vérifiée)
        run: >-
          scripts/ci/install-release.sh
          "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          actionlint actionlint

      - name: Vérifier la syntaxe des workflows
        run: actionlint -color

      - name: Auditer la sécurité des workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format plain .github/

  codeql:
    name: Analyse statique (CodeQL, optionnelle)
    # Désactivée par défaut : exige GitHub Advanced Security si le dépôt est privé.
    # Activer avec la variable de dépôt ENABLE_CODEQL=true (docs/securite-code-et-ci.md).
    if: ${{ vars.ENABLE_CODEQL == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read # CodeQL lit l'état des exécutions pour sa télémétrie de workflow
      contents: read # récupérer le code
      security-events: write # publier les alertes dans l'onglet Sécurité (le seul job qui en a besoin)
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyser
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript-typescript"
